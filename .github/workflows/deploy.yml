name: Deploy to Cloudflare Pages

# Runs on every push to main. Builds a clean output folder (the site files only,
# excluding the Worker source and the workflows themselves) and uploads it to
# the existing 'mirador-pinos' Cloudflare Pages project.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — a Cloudflare API token with 'Cloudflare Pages: Edit'
#                           on this account (rotate periodically).
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'worker/**'
      - '.github/**'
      - 'README.md'
      - '.gitignore'
  workflow_run:
    # Re-run the deploy after the reviews-sync commits a new reviews.json
    # (its commit alone won't trigger `push` events because of the
    #  GITHUB_TOKEN no-recursion rule).
    workflows: ['Sync reviews from issues']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: pip install --quiet beautifulsoup4

      - name: Build deploy bundle
        # 1. rsync everything (assets, images, data, sitemap, robots, etc.)
        # 2. Render per-language pages: _site/index.html (es) + _site/en/index.html (en)
        # 3. Stamp commit SHA into version.txt for the client-side refresh pill
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='worker' --exclude='scripts' \
            --exclude='_site' --exclude='node_modules' \
            --exclude='.credentials' --exclude='.DS_Store' \
            ./ _site/
          python3 scripts/build.py _site
          echo "$GITHUB_SHA" > _site/version.txt
          echo "--- _site contents ---"
          find _site -maxdepth 2 | sort
          echo "--- version stamp ---"
          cat _site/version.txt

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=mirador-pinos --branch=main --commit-dirty=true
