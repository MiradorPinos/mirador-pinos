name: Sync reviews from issues

# Open issues with the `review` label ARE the source of truth for the reviews
# shown on the site. This workflow rebuilds `data/reviews.json` from them on
# every relevant issue event:
#
#   • opened / reopened    → review appears on the site
#   • closed / deleted     → review disappears
#   • edited / labeled     → review content / inclusion is updated
#
# After commit, the deploy workflow picks up the change to data/reviews.json
# and publishes the static site automatically.

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  # Cancel any in-flight sync when a fresher event arrives. Each run
  # rebuilds reviews.json from the current open-issues state, so the
  # latest run is always sufficient — no need to keep stale ones running.
  group: sync-reviews
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild reviews.json from open `review` issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'data/reviews.json';

            // Pull every OPEN issue with the `review` label.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'review',
              per_page: 100,
            });

            const reviews = [];
            for (const issue of issues) {
              if (issue.pull_request) continue; // PRs share the issues endpoint
              const m = (issue.body || '').match(
                /<!-- review-data:start -->\s*```yaml\s*([\s\S]*?)```\s*<!-- review-data:end -->/
              );
              if (!m) {
                core.warning(`Issue #${issue.number} has no review-data block — skipping`);
                continue;
              }

              const parsed = parseYaml(m[1]);
              if (!parsed.author || !parsed.rating) {
                core.warning(`Issue #${issue.number} missing required fields — skipping`);
                continue;
              }

              // Date precedence: explicit YAML date > issue created_at.
              const date = (parsed.date && /^\d{4}-\d{2}-\d{2}/.test(parsed.date))
                ? parsed.date.slice(0, 10)
                : issue.created_at.slice(0, 10);

              const slug = parsed.author.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

              reviews.push({
                id: `${date}-${slug || 'guest'}-i${issue.number}`,
                author: parsed.author,
                date,
                rating: Number(parsed.rating),
                title: parsed.title || '',
                body: parsed.body || '',
                source_issue: issue.number,
              });
            }

            // Newest first
            reviews.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

            const next = JSON.stringify({ reviews }, null, 2) + '\n';
            const prev = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            if (next === prev) {
              core.info('reviews.json unchanged — nothing to commit');
              return;
            }

            fs.writeFileSync(path, next);
            core.info(`reviews.json rebuilt with ${reviews.length} review(s)`);

            const { execSync } = require('child_process');
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync(`git add ${path}`);
            execSync(`git commit -m "reviews: sync from issues (${reviews.length} review(s))"`);

            // Retry push with rebase on non-fast-forward (handles the case where
            // another concurrent run pushed between our checkout and our push).
            let pushed = false;
            for (let attempt = 1; attempt <= 4 && !pushed; attempt++) {
              try {
                execSync('git push origin HEAD:main');
                pushed = true;
              } catch (e) {
                if (attempt === 4) {
                  core.warning(`push failed after ${attempt} attempts; the next issue event will converge`);
                  return;
                }
                core.info(`push attempt ${attempt} failed; rebasing and retrying`);
                try {
                  execSync('git fetch origin main');
                  execSync('git rebase origin/main');
                } catch (rebaseErr) {
                  // Conflict (very unlikely since reviews.json is fully regenerated each run)
                  try { execSync('git rebase --abort'); } catch {}
                  core.warning('rebase conflict; leaving for next event to converge');
                  return;
                }
              }
            }

            // ── tiny YAML parser, just for our known shape ──────────────
            function parseYaml(src) {
              const out = {};
              const lines = src.split('\n');
              let i = 0;
              while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) { i++; continue; }
                const blockMatch = line.match(/^(\w+):\s*\|\s*$/);
                if (blockMatch) {
                  const key = blockMatch[1];
                  const buf = [];
                  i++;
                  while (i < lines.length && /^( {2,}|\t)/.test(lines[i])) {
                    buf.push(lines[i].replace(/^ {2}/, ''));
                    i++;
                  }
                  out[key] = buf.join('\n').trimEnd();
                  continue;
                }
                const kv = line.match(/^(\w+):\s*(.*)$/);
                if (kv) {
                  let v = kv[2].trim();
                  if (v.startsWith('"') && v.endsWith('"')) {
                    try { v = JSON.parse(v); } catch {}
                  } else if (/^-?\d+$/.test(v)) {
                    v = Number(v);
                  }
                  out[kv[1]] = v;
                }
                i++;
              }
              return out;
            }
