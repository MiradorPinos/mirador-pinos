name: Sync reviews from issues

# Open issues with the `review` label ARE the source of truth for the reviews
# shown on the site. This workflow rebuilds `data/reviews.json` from them on
# every relevant issue event:
#
#   • opened / reopened    → review appears on the site
#   • closed / deleted     → review disappears
#   • edited / labeled     → review content / inclusion is updated
#
# After commit, the deploy workflow picks up the change to data/reviews.json
# and publishes the static site automatically.

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  # Cancel any in-flight sync when a fresher event arrives. Each run
  # rebuilds reviews.json from the current open-issues state, so the
  # latest run is always sufficient — no need to keep stale ones running.
  group: sync-reviews
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild reviews.json from open `review` issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = 'data/reviews.json';
            const SUPPORTED_LANGS = ['es', 'en'];

            // Load existing reviews.json so we can reuse cached translations
            // (key = issue number + content hash). MyMemory's free quota is
            // 5000 chars/day per IP — caching makes that effectively unlimited
            // for our scale.
            const prevReviews = (() => {
              try {
                const data = JSON.parse(fs.readFileSync(path, 'utf8'));
                return Object.fromEntries((data.reviews || []).map(r => [r.source_issue, r]));
              } catch { return {}; }
            })();

            // Pull every OPEN issue with the `review` label.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'review',
              per_page: 100,
            });

            const reviews = [];
            for (const issue of issues) {
              if (issue.pull_request) continue; // PRs share the issues endpoint
              const m = (issue.body || '').match(
                /<!-- review-data:start -->\s*```yaml\s*([\s\S]*?)```\s*<!-- review-data:end -->/
              );
              if (!m) {
                core.warning(`Issue #${issue.number} has no review-data block — skipping`);
                continue;
              }

              const parsed = parseYaml(m[1]);
              if (!parsed.author || !parsed.rating) {
                core.warning(`Issue #${issue.number} missing required fields — skipping`);
                continue;
              }

              // Date precedence: explicit YAML date > issue created_at.
              const date = (parsed.date && /^\d{4}-\d{2}-\d{2}/.test(parsed.date))
                ? parsed.date.slice(0, 10)
                : issue.created_at.slice(0, 10);

              const slug = parsed.author.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

              const lang = SUPPORTED_LANGS.includes(parsed.lang) ? parsed.lang : 'es';
              const title = parsed.title || '';
              const body = parsed.body || '';

              // Reuse previous translations when title+body haven't changed.
              const contentHash = sha1(lang + '|' + title + '|' + body);
              const prev = prevReviews[issue.number];
              const cached = (prev && prev._content_hash === contentHash)
                ? (prev.translations || {})
                : {};

              const translations = {};
              for (const target of SUPPORTED_LANGS) {
                if (target === lang) continue; // no need to translate to self
                if (cached[target]) {
                  translations[target] = cached[target];
                  continue;
                }
                core.info(`#${issue.number}: translating ${lang} → ${target}`);
                const t = await translatePair(title, body, lang, target);
                if (t) translations[target] = t;
              }

              reviews.push({
                id: `${date}-${slug || 'guest'}-i${issue.number}`,
                author: parsed.author,
                date,
                rating: Number(parsed.rating),
                title,
                body,
                lang,
                ...(Object.keys(translations).length ? { translations } : {}),
                source_issue: issue.number,
                _content_hash: contentHash,
              });
            }

            // Newest first
            reviews.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

            const next = JSON.stringify({ reviews }, null, 2) + '\n';
            const prev = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            if (next === prev) {
              core.info('reviews.json unchanged — nothing to commit');
              return;
            }

            fs.writeFileSync(path, next);
            core.info(`reviews.json rebuilt with ${reviews.length} review(s)`);

            const { execSync } = require('child_process');
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');
            execSync(`git add ${path}`);
            execSync(`git commit -m "reviews: sync from issues (${reviews.length} review(s))"`);

            // Retry push with rebase on non-fast-forward (handles the case where
            // another concurrent run pushed between our checkout and our push).
            let pushed = false;
            for (let attempt = 1; attempt <= 4 && !pushed; attempt++) {
              try {
                execSync('git push origin HEAD:main');
                pushed = true;
              } catch (e) {
                if (attempt === 4) {
                  core.warning(`push failed after ${attempt} attempts; the next issue event will converge`);
                  return;
                }
                core.info(`push attempt ${attempt} failed; rebasing and retrying`);
                try {
                  execSync('git fetch origin main');
                  execSync('git rebase origin/main');
                } catch (rebaseErr) {
                  // Conflict (very unlikely since reviews.json is fully regenerated each run)
                  try { execSync('git rebase --abort'); } catch {}
                  core.warning('rebase conflict; leaving for next event to converge');
                  return;
                }
              }
            }

            // ── translation via MyMemory (free, no auth) ────────────────
            // Free quota: 5000 chars/day per IP, 50000 with the `de` email
            // hint. Cached by content hash so we don't re-translate on
            // every sync run.
            async function translatePair(title, body, from, to) {
              const tTitle = title ? await mymemory(title, from, to) : '';
              if (title && tTitle === null) return null;
              const tBody  = body  ? await mymemory(body,  from, to) : '';
              if (body && tBody === null) return null;
              return { title: tTitle || '', body: tBody || '' };
            }
            async function mymemory(text, from, to) {
              // MyMemory rejects requests over ~500 chars; split on sentence
              // boundaries to stay under the limit.
              const chunks = chunkText(text.trim(), 480);
              const parts = [];
              for (const c of chunks) {
                const url = `https://api.mymemory.translated.net/get?` +
                  `q=${encodeURIComponent(c)}&langpair=${from}|${to}&de=admin@miradorpinos.com`;
                try {
                  const r = await fetch(url, { headers: { 'User-Agent': 'mirador-pinos-sync/1.0' } });
                  if (!r.ok) { core.warning(`MyMemory HTTP ${r.status}; skipping`); return null; }
                  const j = await r.json();
                  const status = String(j.responseStatus);
                  if (status !== '200') {
                    core.warning(`MyMemory status=${status} msg=${j.responseDetails || ''}; skipping`);
                    return null;
                  }
                  parts.push((j.responseData?.translatedText || '').trim());
                } catch (e) {
                  core.warning(`Translation request failed: ${e.message}; skipping`);
                  return null;
                }
              }
              return parts.join(' ');
            }
            function chunkText(text, max) {
              if (text.length <= max) return [text];
              const sentences = text.split(/(?<=[.!?])\s+/);
              const out = [];
              let cur = '';
              for (const s of sentences) {
                if ((cur + ' ' + s).trim().length > max) {
                  if (cur) out.push(cur);
                  cur = s;
                } else {
                  cur = cur ? cur + ' ' + s : s;
                }
              }
              if (cur) out.push(cur);
              return out.flatMap(c => c.length > max
                ? c.match(new RegExp(`.{1,${max}}`, 'g')) || [c]
                : [c]);
            }
            function sha1(s) {
              return crypto.createHash('sha1').update(s).digest('hex').slice(0, 12);
            }

            // ── tiny YAML parser, just for our known shape ──────────────
            function parseYaml(src) {
              const out = {};
              const lines = src.split('\n');
              let i = 0;
              while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) { i++; continue; }
                const blockMatch = line.match(/^(\w+):\s*\|\s*$/);
                if (blockMatch) {
                  const key = blockMatch[1];
                  const buf = [];
                  i++;
                  while (i < lines.length && /^( {2,}|\t)/.test(lines[i])) {
                    buf.push(lines[i].replace(/^ {2}/, ''));
                    i++;
                  }
                  out[key] = buf.join('\n').trimEnd();
                  continue;
                }
                const kv = line.match(/^(\w+):\s*(.*)$/);
                if (kv) {
                  let v = kv[2].trim();
                  if (v.startsWith('"') && v.endsWith('"')) {
                    try { v = JSON.parse(v); } catch {}
                  } else if (/^-?\d+$/.test(v)) {
                    v = Number(v);
                  }
                  out[kv[1]] = v;
                }
                i++;
              }
              return out;
            }
